<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নোটিশ বোর্ড অ্যাডমিন টুল</title>
<style>
  body { font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif; background:#0f1115; color:#e8e8e8; margin:0; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:#9aa0a6; font-size:14px; margin:0 0 20px; }
  .card { background:#1a1d24; border:1px solid #2a2e37; border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:16px; margin:0 0 12px; }
  label { display:block; font-size:13px; color:#c0c4cc; margin:10px 0 4px; }
  input, textarea, select { width:100%; box-sizing:border-box; padding:10px; border-radius:8px; border:1px solid #333844; background:#0f1115; color:#fff; font-size:15px; font-family:inherit; }
  textarea { resize:vertical; min-height:90px; }
  button { margin-top:14px; width:100%; padding:12px; border:none; border-radius:8px; background:#4f8cff; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { background:#333844; color:#888; }
  button.secondary { background:#2a2e37; }
  button.danger { background:#5c1f2a; color:#ff8080; }
  .result { margin-top:12px; padding:10px; border-radius:8px; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .result.ok { background:#123322; color:#7ee787; border:1px solid #1f5c3a; }
  .result.err { background:#3a1620; color:#ff8080; border:1px solid #5c1f2a; }
  .hidden { display:none; }
  .checkbox-row { display:flex; align-items:center; gap:8px; margin-top:12px; }
  .checkbox-row input { width:auto; }
  .checkbox-row label { margin:0; }
  .notice-item { background:#0f1115; border:1px solid #2a2e37; border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .notice-item .title { font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; }
  .notice-item .body-text { font-size:13px; color:#c0c4cc; margin-top:4px; white-space:pre-wrap; }
  .notice-item .meta { font-size:11px; color:#7a8290; margin-top:6px; }
  .notice-item .actions { display:flex; gap:8px; margin-top:8px; }
  .notice-item .actions button { margin-top:0; width:auto; padding:6px 12px; font-size:12px; }
</style>
</head>
<body>

<h1>📢 নোটিশ বোর্ড অ্যাডমিন টুল</h1>
<p class="sub">স্টুডেন্ট সাইটের ফ্লোটিং বেল আইকনে যে নোটিশ দেখাবে, তা এখান থেকে পোস্ট/মুছে ফেলা যাবে।</p>

<div class="card" id="loginCard">
  <h2>১. অ্যাডমিন লগইন</h2>
  <label>ইউজারনেম</label>
  <input id="username" type="text" autocomplete="username">
  <label>পাসওয়ার্ড</label>
  <input id="password" type="password" autocomplete="current-password">
  <button id="loginBtn" onclick="login()">লগইন করুন</button>
  <div id="loginResult"></div>
</div>

<div class="card hidden" id="postCard">
  <h2>২. নতুন নোটিশ পোস্ট করুন</h2>
  <label>টাইটেল</label>
  <input id="noticeTitle" type="text" placeholder="যেমনঃ ঈদের ছুটিতে পরীক্ষার সময়সূচি">
  <label>বিস্তারিত</label>
  <textarea id="noticeBody" placeholder="নোটিশের বিস্তারিত লিখুন..."></textarea>
  <div class="checkbox-row">
    <input id="noticePinned" type="checkbox">
    <label for="noticePinned">উপরে পিন করে রাখুন</label>
  </div>
  <button onclick="postNotice()">পোস্ট করুন</button>
  <div id="postResult"></div>
</div>

<div class="card hidden" id="listCard">
  <h2>৩. বিদ্যমান নোটিশসমূহ</h2>
  <button class="secondary" onclick="loadNotices()">রিফ্রেশ করুন</button>
  <div id="noticeList" style="margin-top:12px;"></div>
</div>

<script>
  let token = null;

  function showResult(elId, ok, text) {
    const el = document.getElementById(elId);
    el.className = 'result ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) return showResult('loginResult', false, 'ইউজারনেম ও পাসওয়ার্ড দিন');
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    try {
      const r = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'লগইন ব্যর্থ');
      token = data.token;
      showResult('loginResult', true, 'লগইন সফল ✓');
      document.getElementById('postCard').classList.remove('hidden');
      document.getElementById('listCard').classList.remove('hidden');
      loadNotices();
    } catch (err) {
      showResult('loginResult', false, err.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function apiCall(path, method, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'সার্ভার সমস্যা');
    return data;
  }

  async function postNotice() {
    const title = document.getElementById('noticeTitle').value.trim();
    const body = document.getElementById('noticeBody').value.trim();
    const is_pinned = document.getElementById('noticePinned').checked;
    if (!title || !body) return showResult('postResult', false, 'টাইটেল ও বিস্তারিত দুটোই দিন');
    try {
      await apiCall('/api/notices', 'POST', { title, body, is_pinned });
      showResult('postResult', true, 'নোটিশ পোস্ট হয়েছে ✓');
      document.getElementById('noticeTitle').value = '';
      document.getElementById('noticeBody').value = '';
      document.getElementById('noticePinned').checked = false;
      loadNotices();
    } catch (err) {
      showResult('postResult', false, err.message);
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  async function loadNotices() {
    const list = document.getElementById('noticeList');
    list.innerHTML = '<p style="color:#9aa0a6; font-size:13px;">লোড হচ্ছে...</p>';
    try {
      const data = await apiCall('/api/notices?limit=50', 'GET');
      if (!data.notices.length) {
        list.innerHTML = '<p style="color:#9aa0a6; font-size:13px;">কোনো নোটিশ নেই।</p>';
        return;
      }
      list.innerHTML = data.notices.map(n => `
        <div class="notice-item">
          <div class="title">${n.is_pinned ? '📌' : ''} ${escapeHtml(n.title)}</div>
          <div class="body-text">${escapeHtml(n.body)}</div>
          <div class="meta">${new Date(n.created_at).toLocaleString('bn-BD')}</div>
          <div class="actions">
            <button class="secondary" onclick="togglePin(${n.id})">${n.is_pinned ? 'আনপিন' : 'পিন'}</button>
            <button class="danger" onclick="deleteNotice(${n.id})">মুছুন</button>
          </div>
        </div>
      `).join('');
    } catch (err) {
      list.innerHTML = '';
      showResult('postResult', false, err.message);
    }
  }

  async function togglePin(id) {
    try {
      await apiCall('/api/notices/' + id + '/pin', 'PATCH');
      loadNotices();
    } catch (err) {
      showResult('postResult', false, err.message);
    }
  }

  async function deleteNotice(id) {
    if (!confirm('এই নোটিশটি মুছে ফেলতে চান?')) return;
    try {
      await apiCall('/api/notices/' + id, 'DELETE');
      loadNotices();
    } catch (err) {
      showResult('postResult', false, err.message);
    }
  }
</script>

</body>
</html>
